const uid=()=>crypto.randomUUID();
function path(contours){return contours.map(poly=>poly.map(([x,y],i)=>`${i?'L':'M'}${x*1000} ${y*1000}`).join(' ')+' Z').join(' ');}
function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(el.timer);el.timer=setTimeout(()=>el.classList.remove('show'),4500);}
async function api(url,options={}){const headers={...options.headers};let body=options.body;if(body&&!(body instanceof Blob)&&!(body instanceof ArrayBuffer)){headers['Content-Type']='application/json';body=JSON.stringify(body);}const response=await fetch(url,{...options,headers,body});const result=await response.json();if(!response.ok){const error=new Error(result.error||'요청을 처리하지 못했습니다.');error.status=response.status;throw error;}return result;}
function download(name,content,type='application/json'){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const labels={home:['홈','Home'],info:['전시 안내','Visit'],cv:['약력','CV'],statement:['작가 노트','Statement'],paintings:['작품','Paintings'],symbolism:['상징 이야기','Symbolism']};
function themeStyle(t){const color=t.patternColor+Math.round(t.patternOpacity/100*255).toString(16).padStart(2,'0');const bg=t.pattern==='dots'?`radial-gradient(${color} ${t.patternSize/2}px,transparent ${t.patternSize/2+.4}px)`:t.pattern==='lines'?`repeating-linear-gradient(0deg,transparent,transparent ${t.patternSpacing-1}px,${color} ${t.patternSpacing-1}px,${color} ${t.patternSpacing}px)`:'none';return `--paper:${t.background};--accent:${t.accent};--pattern:${bg};--spacing:${t.patternSpacing}px;--display:${t.font==='serif'?"'Noto Serif KR', 'Batang', Georgia, serif":"'Apple SD Gothic Neo', sans-serif"}`;}
function dialog(title,markup,className=''){const el=document.createElement('dialog');el.className=`dialog ${className}`;el.innerHTML=`<div class="dialog-head"><h2>${h(title)}</h2><button class="icon-btn" data-close aria-label="닫기">✕</button></div>${markup}`;document.body.append(el);el.querySelector('[data-close]').onclick=()=>el.close();el.addEventListener('close',()=>el.remove(),{once:true});el.addEventListener('click',event=>{if(event.target===el)el.close();});el.showModal();return el;}


function mountVisitor(container,project,{demo=false,preview=false}={}){
  let lang=project.sourceLanguage,page='home';
  const t=v=>text(v,lang),en=()=>lang==='en';
  const name=()=>t(project.artist.name);
  const works=()=>project.artworks.map(a=>`<button class="work-card" data-work="${h(a.id)}"><div class="work-image"><img src="${image(a.imageId)}" alt="${h(t(a.title))}" loading="lazy"><span class="work-hint">${en()?'Explore the story ↗':'그림 속 이야기를 만나보세요 ↗'}</span></div><div class="work-caption"><h3>${h(t(a.title))}</h3><span>${h(a.date)}</span></div><p>${h(t(a.medium))} · ${h(a.width)} × ${h(a.height)} cm</p></button>`).join('');
  function visitInfo(){const e=project.exhibition,query=encodeURIComponent(t(e.address));return `<div class="visit-grid"><div><span class="eyebrow">COME SAY HELLO</span><h2>${h(t(e.gallery))}</h2><p>${h(t(e.address))}</p><div class="map-links"><a href="https://www.google.com/maps/search/?api=1&query=${query}" target="_blank" rel="noopener">Google Maps ↗</a><a href="https://map.naver.com/p/search/${query}" target="_blank" rel="noopener">네이버 지도 ↗</a><a href="https://map.kakao.com/link/search/${query}" target="_blank" rel="noopener">카카오맵 ↗</a></div></div><dl class="info-list"><dt>${en()?'Dates':'전시 기간'}</dt><dd>${h(e.startDate)} — ${h(e.endDate)}</dd><dt>${en()?'Hours':'관람 시간'}</dt><dd>${h(e.hours)}<small>${h(t(e.closed))}</small></dd><dt>${en()?'Admission':'관람료'}</dt><dd>${h(t(e.admission))}</dd><dt>${en()?'Parking':'주차'}</dt><dd>${h(t(e.parking))}</dd><dt>${en()?'Opening & events':'오프닝 · 행사'}</dt><dd class="multiline">${h(t(e.events))}</dd>${e.sns?`<dt>SNS</dt><dd><a href="${h(e.sns)}" target="_blank" rel="noopener">${en()?'Gallery social':'갤러리 소식'} ↗</a></dd>`:''}</dl></div>`;}
  function render(){const p=project,e=p.exhibition;container.innerHTML=`<div class="visitor ${h(p.theme.template)}" style="${themeStyle(p.theme)}">${demo?'<div class="demo-banner">샘플 작가와 전시로 만든 체험 사이트입니다. <a href="/app">내 전시 만들기 ↗</a></div>':''}<header class="visitor-header"><button class="artist-logo" data-page="home">${h(name())}<span>ARTIST & STORY</span></button><nav aria-label="전시 메뉴">${p.menu.map(key=>`<button data-page="${key}" class="${key===page?'active':''}">${labels[key][en()?1:0]}</button>`).join('')}</nav><div class="lang-switch">${p.languages.map(l=>`<button data-lang="${l}" class="${lang===l?'active':''}" aria-label="${l==='ko'?'한국어':'English'}">${l==='ko'?'KO':'EN'}</button>`).join('')}</div></header><main>${page==='home'?`<section class="exhibition-hero"><div class="hero-copy"><span class="eyebrow">A LITTLE EXHIBITION, A WORLD OF STORIES</span><h1>${h(t(e.title)).replace('의 정원','의<br>정원')}</h1><p class="hero-subtitle">${h(t(e.subtitle))}</p><p class="hero-description">${h(t(e.description))}</p><div class="hero-meta"><span>${h(e.startDate.replaceAll('-','.'))} — ${h(e.endDate.replaceAll('-','.'))}</span><span>${h(t(e.gallery))} · ${h(e.hours)}</span></div><button class="pill-btn" data-page="paintings">${en()?'Meet the paintings':'작품 속으로 들어가기'} <span>↗</span></button></div><div class="hero-art"><span class="handwritten">${en()?'A small story awaits you.':'작은 이야기들이 당신을 기다려요'}</span><img class="motion-${h(p.theme.motion)}" src="${image(p.theme.heroImage||p.artworks[0]?.imageId)}" alt="${en()?'Exhibition illustration':'전시 대표 이미지'}"><span class="hero-stamp">${en()?'TAKE YOUR TIME':'천천히<br>둘러보세요'}</span></div></section><section class="section-wrap"><div class="section-title"><div><span class="eyebrow">PAINTINGS & THEIR STORIES</span><h2>${en()?'Every painting holds a little world.':'그림마다, 작은 세계가 있어요.'}</h2></div><button class="text-btn" data-page="paintings">${en()?'All paintings':'모든 작품 보기'} ↗</button></div><div class="works-grid">${works()}</div></section><section class="home-note"><span class="tiny-star">✳</span><p>${h(t(p.artist.bio))}</p><button class="text-btn" data-page="statement">${en()?'Read the artist’s note':'작가의 이야기를 읽어보세요'} ↗</button></section><section class="section-wrap home-visit">${visitInfo()}</section>`:page==='paintings'?`<section class="section-wrap page-section"><span class="eyebrow">PAINTINGS</span><h1>${en()?'Stories within the frame':'그림 속에 담긴 이야기'}</h1><p class="page-intro">${en()?'Open a painting and select a marked object to read its story.':'작품을 열고 표시된 사물을 눌러보세요. 그 안에 담긴 이야기를 만날 수 있어요.'}</p><div class="works-grid">${works()}</div></section>`:page==='info'?`<section class="section-wrap page-section"><span class="eyebrow">EXHIBITION INFO</span><h1>${en()?'A visit to the garden':'정원에 오시는 길'}</h1>${visitInfo()}</section>`:page==='statement'?`<section class="reading-page"><span class="eyebrow">ARTIST STATEMENT</span><h1>${en()?'A note from the artist':'작가의 노트'}</h1><div class="multiline prose">${h(t(p.artist.statement))}</div><p class="signature">${h(name())}</p></section>`:page==='cv'?`<section class="reading-page"><span class="eyebrow">CURRICULUM VITAE</span><h1>${h(name())}</h1><p class="prose">${h(t(p.artist.bio))}</p><div class="cv-list multiline">${h(t(p.artist.cv))}</div>${p.artist.instagram?`<a class="text-btn" href="${h(p.artist.instagram)}" rel="noopener" target="_blank">Instagram ↗</a>`:''}</section>`:`<section class="section-wrap page-section"><span class="eyebrow">SYMBOLISM</span><h1>${en()?'The language of little things':'작은 사물들의 언어'}</h1><div class="symbols-grid">${p.symbols.map((s,i)=>`<article class="symbol-card"><span class="symbol-number">0${i+1}</span><h2>${h(t(s.name))}</h2><p class="multiline">${h(t(s.story))}</p><div class="related-links">${p.artworks.filter(a=>a.hotspots.some(r=>r.symbolId===s.id)).map(a=>`<button data-work="${h(a.id)}">${h(t(a.title))} ↗</button>`).join('')}</div></article>`).join('')}</div></section>`}</main><footer class="visitor-footer"><span>${h(name())} · ${h(t(e.title))}</span><span>Made with <a href="/app">Atelier Stories</a> ${preview?'· DRAFT PREVIEW':''}</span></footer></div>`;
    container.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();if(!preview)window.scrollTo({top:0,behavior:'smooth'});});
    container.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render();});
    container.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>openWork(b.dataset.work));
    if(!preview)document.title=`${t(e.title)} — ${name()}`;
  }
  function openWork(id){const artwork=project.artworks.find(a=>a.id===id);if(!artwork)return;let active=null,visible=true;
    const modal=dialog(t(artwork.title),'<div class="work-detail"></div>','artwork-dialog');
    const host=modal.querySelector('.work-detail');
    const setStory=()=>{const r=artwork.hotspots.find(x=>x.id===active),s=project.symbols.find(x=>x.id===r?.symbolId);const area=host.querySelector('.story-panel');area.innerHTML=r?`<span class="eyebrow">A STORY IN THE PAINTING</span><h3>${h(t(s?.name))}</h3><p class="multiline">${h(t(r.story)||t(s?.story))}</p><div class="related-links">${project.artworks.filter(a=>a.id!==id&&a.hotspots.some(x=>x.symbolId===s?.id)).map(a=>`<button data-related="${h(a.id)}">${h(t(a.title))} ↗</button>`).join('')}</div>`:`<span class="eyebrow">LOOK A LITTLE CLOSER</span><h3>${en()?'What caught your eye?':'어떤 사물이 눈에 들어오나요?'}</h3><p>${en()?'Select a marked object in the painting, or choose a name below.':'그림 속 테두리가 있는 사물이나 아래 이름을 눌러보세요.'}</p>`;host.querySelectorAll('[data-region]').forEach(el=>el.classList.toggle('selected',el.dataset.region===active));area.querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>{modal.close();openWork(b.dataset.related);});};
    host.innerHTML=`<div class="art-canvas"><img src="${image(artwork.imageId)}" alt="${h(t(artwork.title))}"><svg viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-label="작품 속 상징">${artwork.hotspots.map(r=>`<path d="${path(r.contours)}" fill-rule="evenodd" tabindex="0" role="button" aria-label="${h(t(project.symbols.find(s=>s.id===r.symbolId)?.name))}" data-region="${h(r.id)}"/>`).join('')}</svg></div><div class="detail-toolbar"><span>${h(artwork.date)} · ${h(t(artwork.medium))} · ${h(artwork.width)} × ${h(artwork.height)} cm</span><button class="text-btn" data-outline>${en()?'Hide outlines':'테두리 숨기기'}</button></div><p class="multiline">${h(t(artwork.description))}</p><div class="region-chips">${artwork.hotspots.map(r=>`<button class="chip" data-region="${h(r.id)}">${h(t(project.symbols.find(s=>s.id===r.symbolId)?.name))}</button>`).join('')}</div><div class="story-panel" aria-live="polite"></div>`;
    host.querySelectorAll('[data-region]').forEach(el=>{const activate=()=>{active=el.dataset.region;setStory();};el.onclick=activate;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate();}};});
    host.querySelector('[data-outline]').onclick=e=>{visible=!visible;host.querySelector('svg').classList.toggle('hide-outlines',!visible);e.target.textContent=visible?(en()?'Hide outlines':'테두리 숨기기'):(en()?'Show outlines':'테두리 보기');};setStory();
  }
  render();return {render};
}
